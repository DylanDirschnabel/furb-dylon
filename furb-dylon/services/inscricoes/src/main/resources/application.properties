spring.application.name=inscricoes
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inscricoes}
spring.datasource.username=${DB_USER:inscricoes}
spring.datasource.password=${DB_PASSWORD:inscricoes}
spring.datasource.hikari.maximum-pool-size=20
spring.sql.init.mode=always

dylon.vagas-total=${VAGAS_TOTAL:10}
dylon.validacao-timeout-s=${VALIDACAO_TIMEOUT_S:30}
dylon.queue-entrada=${QUEUE_ENTRADA:inscricoes}
dylon.queue-coletor=${QUEUE_COLETOR:coletor}
dylon.topic-inscricoes=${TOPIC_INSCRICOES:inscricoes-eventos}
