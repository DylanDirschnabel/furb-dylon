spring.application.name=notas
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notas}
spring.datasource.username=${DB_USER:notas}
spring.datasource.password=${DB_PASSWORD:notas}
spring.sql.init.mode=always

dylon.queue-entrada=${QUEUE_ENTRADA:notas}
dylon.topic-notas=${TOPIC_NOTAS:notas-eventos}
dylon.processamento-ms=${PROCESSAMENTO_MS:300}
